{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Sign in" %}</title>
</head>
<body>
  <h1>{% trans "Sign in" %}</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>{% trans "Email address" %} <input type="email" name="email" value="{{ email }}" autocomplete="username" required></label></p>
    <p><label>{% trans "Password" %} <input type="password" name="password" autocomplete="current-password" required></label></p>
    <button type="submit">{% trans "Sign in" %}</button>
  </form>
</body>
</html>
