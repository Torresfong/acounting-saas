{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Accounting platform" %}</title>
</head>
<body>
  <h1>{% trans "Welcome" %}</h1>
  <p>{% blocktrans with email=request.user.email %}Signed in as {{ email }}{% endblocktrans %}</p>
  <form method="post" action="/logout/">
    {% csrf_token %}
    <button type="submit">{% trans "Sign out" %}</button>
  </form>
</body>
</html>
