{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }}</title>
</head>
<body>
  <h1>{{ heading }}</h1>
  {% if errors %}<ul role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>{% trans "New password" %} <input type="password" name="password" autocomplete="new-password" required></label></p>
    <p><label>{% trans "Repeat the password" %} <input type="password" name="confirm" autocomplete="new-password" required></label></p>
    <button type="submit">{% trans "Save password" %}</button>
  </form>
</body>
</html>
