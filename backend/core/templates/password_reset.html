{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Reset your password" %}</title>
</head>
<body>
  <h1>{% trans "Reset your password" %}</h1>
  {% if sent %}
    <p role="status">{% trans "If that email address has an account, we have sent a link to choose a new password." %}</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      <p><label>{% trans "Email address" %} <input type="email" name="email" autocomplete="username" required></label></p>
      <button type="submit">{% trans "Send reset link" %}</button>
    </form>
  {% endif %}
  <p><a href="/login/">{% trans "Back to sign in" %}</a></p>
</body>
</html>
